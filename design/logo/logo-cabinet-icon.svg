<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="t">
  <title id="t">Shelfie - wordmark in a walnut cabinet</title>
  <defs>
    <!-- Wordmark letter strokes (wordmark units: 164 x 60, baseline y=48) -->
    <g id="letters">
      <path d="M25 28.5C23 25 19.5 24 16.5 24C12 24 9 26.5 9 29.5C9 33 13 34.5 17 35.5C21.5 36.5 26 38 26 42C26 45.5 22.5 48 17.5 48C13.5 48 10 46.5 8 43.5"/>
      <path d="M35 12V48M35 33C35 27 38.5 24 43 24C47.5 24 50.5 27 50.5 32V48"/>
      <path d="M60 36H80C80 29 76 24 70 24C63.5 24 59 29 59 36C59 43 63.5 48 70.5 48C74.5 48 77.5 46.5 79.5 43.5"/>
      <path d="M118 13.5C116.5 12.5 115 12 113.5 12C109.5 12 107 14.5 107 19V48M101 26H116"/>
      <path d="M126 27V48"/>
      <path d="M135 36H155C155 29 151 24 145 24C138.5 24 134 29 134 36C134 43 138.5 48 145.5 48C149.5 48 152.5 46.5 154.5 43.5"/>
    </g>

    <radialGradient id="bg" cx="50%" cy="28%" r="80%">
      <stop offset="0" stop-color="#6A4128"/>
      <stop offset="0.55" stop-color="#3A2418"/>
      <stop offset="1" stop-color="#22150E"/>
    </radialGradient>
    <linearGradient id="walnut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A2703F"/>
      <stop offset="0.5" stop-color="#7A4E2C"/>
      <stop offset="1" stop-color="#553520"/>
    </linearGradient>
    <linearGradient id="backWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBEBCF"/>
      <stop offset="1" stop-color="#E2C49A"/>
    </linearGradient>
    <radialGradient id="spot" cx="512" cy="360" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftFace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4A2E1B"/>
      <stop offset="1" stop-color="#6E472A"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5A3921"/>
      <stop offset="1" stop-color="#3A2414"/>
    </linearGradient>
    <linearGradient id="shelfFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E5E36"/>
      <stop offset="1" stop-color="#B7824F"/>
    </linearGradient>
    <radialGradient id="floorShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2A1609" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2A1609" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="letterFace" x1="0" y1="9" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6E4C37"/>
      <stop offset="1" stop-color="#34241A"/>
    </linearGradient>
    <linearGradient id="spineFront" x1="87" y1="0" x2="98" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2AA193"/>
      <stop offset="1" stop-color="#166B61"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6DB9A"/>
      <stop offset="1" stop-color="#C99A45"/>
    </linearGradient>
    <radialGradient id="flameGlow" cx="126" cy="12" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB347" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFB347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flameOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9A3C"/>
      <stop offset="1" stop-color="#D9531E"/>
    </linearGradient>
  </defs>

  <!-- Background (iOS masks the corners of the full square) -->
  <rect width="1024" height="1024" rx="225" fill="url(#bg)"/>

  <!-- Cabinet feet -->
  <rect x="150" y="762" width="70" height="44" rx="10" fill="#3E2616"/>
  <rect x="804" y="762" width="70" height="44" rx="10" fill="#3E2616"/>

  <!-- Cabinet body -->
  <rect x="64" y="250" width="896" height="524" rx="48" fill="url(#walnut)"/>
  <rect x="64" y="250" width="896" height="524" rx="48" fill="none" stroke="#C99466" stroke-opacity="0.55" stroke-width="4"/>

  <!-- Compartment in perspective: back wall, then the four inner faces -->
  <rect x="184" y="360" width="656" height="304" fill="url(#backWall)"/>
  <rect x="184" y="360" width="656" height="304" fill="url(#spot)"/>
  <path d="M124 310H900L840 360H184Z" fill="#35200F"/>
  <path d="M124 310L184 360V664L124 714Z" fill="url(#leftFace)"/>
  <path d="M900 310V714L840 664V360Z" fill="url(#rightFace)"/>
  <path d="M124 714H900L840 664H184Z" fill="url(#shelfFloor)"/>
  <!-- Front lip of the opening -->
  <rect x="124" y="310" width="776" height="404" fill="none" stroke="#C99466" stroke-width="6"/>

  <!-- Soft contact shadow on the shelf -->
  <ellipse cx="512" cy="692" rx="340" ry="17" fill="url(#floorShadow)"/>

  <!-- The wordmark, standing on the shelf -->
  <g transform="translate(192 491) scale(3.9)">
    <g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <!-- Shadow cast on the back wall -->
      <use href="#letters" stroke="#5A3418" stroke-opacity="0.22" transform="translate(3.5 2.5)"/>
      <!-- Depth (letter thickness) -->
      <use href="#letters" stroke="#1C110B" transform="translate(0 2.2)"/>
      <!-- Face -->
      <use href="#letters" stroke="url(#letterFace)"/>
      <!-- Bevel highlight -->
      <use href="#letters" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.8" transform="translate(-0.7 -1.3)"/>
    </g>

    <!-- The "l" is a real book: front, top and side faces, gold-foil bands -->
    <rect x="89.5" y="9.5" width="11" height="38.5" rx="1.5" fill="#5A3418" opacity="0.22" transform="translate(2 1)"/>
    <path d="M87 9.5H98L101 7H90Z" fill="#48C2B2"/>
    <path d="M98 9.5L101 7V45.5L98 48Z" fill="#0F4F48"/>
    <rect x="87" y="9.5" width="11" height="38.5" rx="1" fill="url(#spineFront)"/>
    <rect x="87" y="14" width="11" height="1.8" fill="url(#gold)"/>
    <rect x="87" y="41.8" width="11" height="1.8" fill="url(#gold)"/>
    <rect x="89.5" y="22" width="6" height="14" rx="0.8" fill="none" stroke="url(#gold)" stroke-width="0.7"/>

    <!-- Glowing flame as the dot of the "i" -->
    <circle cx="126" cy="12" r="16" fill="url(#flameGlow)"/>
    <path fill="url(#flameOuter)" d="M126 5C129 8.4 131 10.6 131 13.2C131 16 128.8 18 126 18C123.2 18 121 16 121 13.2C121 11.5 122.1 10 123.2 9C123.4 10.7 124.3 11.7 125.3 11.9C124.8 9.5 125 7.2 126 5Z"/>
    <path fill="#FFD76A" d="M126 10.2C127.4 11.8 128.3 12.9 128.3 14.2C128.3 15.6 127.3 16.5 126 16.5C124.7 16.5 123.7 15.6 123.7 14.2C123.7 13.3 124.2 12.6 124.7 12.2C124.8 13 125.2 13.4 125.7 13.6C125.4 12.5 125.6 11.3 126 10.2Z"/>
  </g>

  <!-- Gloss across the top of the cabinet -->
  <path d="M112 250H912A48 48 0 0 1 960 298V304H64V298A48 48 0 0 1 112 250Z" fill="#FFFFFF" opacity="0.10"/>
</svg>
