<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">Shelfie – cozy shelf</title>
  <rect width="64" height="64" rx="14" fill="#F2A93B"/>
  <!-- Books standing on the shelf (bottoms at y=44) -->
  <rect x="13" y="20" width="8" height="24" rx="2" fill="#1F8A7E"/>
  <rect x="13" y="24" width="8" height="1.8" fill="#FFF4E0"/>
  <rect x="13" y="38.5" width="8" height="1.8" fill="#FFF4E0"/>
  <rect x="22.5" y="15" width="9" height="29" rx="2" fill="#C8435A"/>
  <rect x="22.5" y="19" width="9" height="1.8" fill="#FFF4E0"/>
  <rect x="22.5" y="38.5" width="9" height="1.8" fill="#FFF4E0"/>
  <rect x="33" y="22" width="7" height="22" rx="2" fill="#2D4A7A"/>
  <rect x="33" y="26" width="7" height="1.8" fill="#FFF4E0"/>
  <!-- The last book leans on its neighbour -->
  <g transform="rotate(14 41.5 44)">
    <rect x="41.5" y="22" width="7" height="22" rx="2" fill="#FFF4E0"/>
    <rect x="41.5" y="26" width="7" height="1.8" fill="#E07A2E"/>
  </g>
  <!-- Shelf board -->
  <rect x="9" y="44" width="46" height="5" rx="2.5" fill="#7A4A2A"/>
</svg>
