<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="t">
  <title id="t">Shelfie - Liquid Glass bookcase</title>
  <defs>
    <!-- The glass: frame + three shelves drawn as one stroke, so the pieces merge like a GlassEffectContainer -->
    <path id="glassShape" fill="none" stroke-linecap="round" stroke-linejoin="round"
          d="M300 820V300A70 70 0 0 1 370 230H654A70 70 0 0 1 724 300V820M300 430H724M300 620H724M300 800H724"/>

    <!-- Solid, vivid books behind the glass -->
    <g id="books">
      <rect x="350" y="290" width="58" height="122" rx="12" fill="#F59E2E"/>
      <rect x="416" y="268" width="66" height="144" rx="12" fill="#14A58F"/>
      <rect x="490" y="312" width="52" height="100" rx="12" fill="#E5486A"/>
      <rect x="350" y="478" width="62" height="124" rx="12" fill="#6C5CE7"/>
      <rect x="420" y="500" width="52" height="102" rx="12" fill="#F59E2E"/>
      <rect x="580" y="462" width="60" height="140" rx="12" fill="#14A58F" transform="rotate(12 610 602)"/>
      <rect x="350" y="660" width="72" height="122" rx="12" fill="#E5486A"/>
      <rect x="430" y="640" width="58" height="142" rx="12" fill="#14A58F"/>
      <rect x="496" y="676" width="52" height="106" rx="12" fill="#F59E2E"/>
      <rect x="556" y="668" width="62" height="114" rx="12" fill="#6C5CE7"/>
    </g>

    <mask id="glassMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <use href="#glassShape" stroke="#FFFFFF" stroke-width="60"/>
    </mask>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#CBD3DE"/>
      <stop offset="1" stop-color="#8C98AA"/>
    </linearGradient>
    <filter id="refract" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="225" fill="#FFFFFF"/>

  <!-- Books (seen directly where no glass covers them) -->
  <use href="#books"/>

  <!-- Soft shadow that lifts the glass off the page -->
  <use href="#glassShape" stroke="#1C2A40" stroke-opacity="0.2" stroke-width="60" transform="translate(0 18)" filter="url(#shadow)"/>

  <!-- Thin outer rim: light at top-left, cooler at bottom-right -->
  <use href="#glassShape" stroke="url(#rim)" stroke-width="66"/>

  <!-- Inside the glass: the content behind it, blurred and slightly magnified (refraction) -->
  <g mask="url(#glassMask)">
    <rect width="1024" height="1024" fill="#EAEFF5"/>
    <g filter="url(#refract)" transform="translate(512 540) scale(1.07) translate(-512 -540)">
      <use href="#books"/>
    </g>
    <!-- Clear glass picks up a little light; brighter in the middle, so the edges read as lensing -->
    <use href="#glassShape" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="60"/>
    <use href="#glassShape" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="36"/>
  </g>

  <!-- Specular highlights where light hits the top-left edge -->
  <path d="M283 700V300A87 87 0 0 1 370 213H620" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <path d="M740 330V520" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-opacity="0.85">
    <path d="M340 413H690"/>
    <path d="M340 603H690"/>
    <path d="M340 783H690"/>
  </g>
</svg>
