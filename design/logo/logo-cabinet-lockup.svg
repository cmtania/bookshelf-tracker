  <rect x="144" y="106" width="912" height="238" fill="url(#backWall)"/>
  <rect x="144" y="106" width="912" height="238" fill="url(#spot)"/>
  <path d="M84 66H1116L1056 106H144Z" fill="#35200F"/>
  <path d="M84 66L144 106V344L84 384Z" fill="url(#leftFace)"/>
  <path d="M1116 66V384L1056 344V106Z" fill="url(#rightFace)"/>
  <path d="M84 384H1116L1056 344H144Z" fill="url(#shelfFloor)"/>
  <rect x="84" y="66" width="1032" height="318" fill="none" stroke="#C99466" stroke-width="6"/>

  <ellipse cx="600" cy="366" rx="400" ry="15" fill="url(#floorShadow)"/>

