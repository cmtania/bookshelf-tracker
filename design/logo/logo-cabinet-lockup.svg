<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="t">
  <title id="t">Shelfie - wordmark in a walnut cabinet (wide)</title>
  <defs>
    <g id="letters">
      <path d="M25 28.5C23 25 19.5 24 16.5 24C12 24 9 26.5 9 29.5C9 33 13 34.5 17 35.5C21.5 36.5 26 38 26 42C26 45.5 22.5 48 17.5 48C13.5 48 10 46.5 8 43.5"/>
      <path d="M35 12V48M35 33C35 27 38.5 24 43 24C47.5 24 50.5 27 50.5 32V48"/>
      <path d="M60 36H80C80 29 76 24 70 24C63.5 24 59 29 59 36C59 43 63.5 48 70.5 48C74.5 48 77.5 46.5 79.5 43.5"/>
      <path d="M118 13.5C116.5 12.5 115 12 113.5 12C109.5 12 107 14.5 107 19V48M101 26H116"/>
      <path d="M126 27V48"/>
      <path d="M135 36H155C155 29 151 24 145 24C138.5 24 134 29 134 36C134 43 138.5 48 145.5 48C149.5 48 152.5 46.5 154.5 43.5"/>
    </g>
    <linearGradient id="walnut" x1="0" y1="0" x2="0" y2="1">
