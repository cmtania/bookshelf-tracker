      <stop offset="1" stop-color="#B7824F"/>
    </linearGradient>
    <radialGradient id="floorShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2A1609" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2A1609" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="letterFace" x1="0" y1="9" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6E4C37"/>
      <stop offset="1" stop-color="#34241A"/>
    </linearGradient>
    <linearGradient id="spineFront" x1="87" y1="0" x2="98" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2AA193"/>
      <stop offset="1" stop-color="#166B61"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6DB9A"/>
      <stop offset="1" stop-color="#C99A45"/>
    </linearGradient>
    <radialGradient id="flameGlow" cx="126" cy="12" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB347" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFB347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flameOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9A3C"/>
      <stop offset="1" stop-color="#D9531E"/>
    </linearGradient>
  </defs>

  <!-- Feet -->
  <rect x="110" y="410" width="80" height="44" rx="10" fill="#3E2616"/>
  <rect x="1010" y="410" width="80" height="44" rx="10" fill="#3E2616"/>

  <!-- Cabinet body -->
