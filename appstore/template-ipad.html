<!doctype html>
<!-- App Store promo frame, 2064 x 2752 (13" iPad, portrait). Rendered by render.ps1 with URL parameters:
     ?shot=<file in raw/>&title=<headline>&sub=<subtitle>&theme=orange|cream|dark
     The screenshot fills a 3:4 iPad screen (13" iPad captures are 2064 x 2752, exactly 3:4). -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Plus Jakarta Sans';
    src: url('../../bookshelf-tracker-docs/public/assets/fonts/plus-jakarta-sans.woff2') format('woff2');
    font-weight: 200 800;
  }
  html, body { margin: 0; width: 2064px; height: 2752px; overflow: hidden; }
  body {
    position: relative;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .orange { background: radial-gradient(120% 70% at 85% 0%, #ffc24d, #ffa500 45%, #f08f00); color: #24170f; }
  .cream  { background: radial-gradient(120% 70% at 15% 0%, #fff3dc, #fdf0dc 45%, #f6e3c3); color: #24170f; }
  .dark   { background: radial-gradient(120% 70% at 80% 0%, #4a3122, #24170f 55%, #1a100a); color: #fff8ee; }

  /* Soft decorative glow */
  .glow { position: absolute; width: 1600px; height: 1600px; border-radius: 50%; filter: blur(160px); opacity: 0.45; pointer-events: none; }
  .orange .glow { background: #fff1c9; left: -560px; top: 900px; }
  .cream .glow  { background: #ffd48a; right: -620px; top: 1000px; }
  .dark .glow   { background: #ffa500; right: -700px; top: 1100px; opacity: 0.25; }

  .caption { position: absolute; top: 150px; left: 160px; right: 160px; text-align: center; }
  h1 { margin: 0; font-size: 128px; line-height: 1.06; font-weight: 800; letter-spacing: -3.5px; }
  p  { margin: 36px auto 0; max-width: 1500px; font-size: 60px; line-height: 1.3; font-weight: 500; opacity: 0.78; }

  /* iPad frame around the screenshot: thin, even bezel; the whole screen fits below the caption. */
  .ipad {
    position: absolute;
    left: 50%;
    top: 700px;
    width: 1460px; /* content width; with the 30px bezel the frame ends at 2707px, inside 2752 */
    transform: translateX(-50%);
    padding: 30px;
    border-radius: 96px;
    background: linear-gradient(145deg, #4a4a4f, #151517 40%, #2e2e32);
    box-shadow: 0 0 0 4px #5a5a60 inset, 0 70px 140px rgba(40, 20, 0, 0.38);
  }
  .dark .ipad { box-shadow: 0 0 0 4px #6a6a70 inset, 0 70px 160px rgba(0, 0, 0, 0.6); }
  .ipad img {
    display: block;
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    object-position: top;
    border-radius: 66px;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="caption">
    <h1 id="title"></h1>
    <p id="sub"></p>
  </div>
  <div class="ipad"><img id="shot" alt="" /></div>
  <script>
    const q = new URLSearchParams(location.search);
    document.body.className = q.get('theme') || 'orange';
    document.getElementById('title').textContent = q.get('title') || '';
    document.getElementById('sub').textContent = q.get('sub') || '';
    document.getElementById('shot').src = 'raw/' + (q.get('shot') || '');
  </script>
</body>
</html>
