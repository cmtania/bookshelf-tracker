# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
# (brew install xcodegen). Shelfie.xcodeproj is generated and git-ignored.
name: Shelfie
options:
  bundleIdPrefix: com.cmtania
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your team here or in Xcode > Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
targets:
  Shelfie:
    type: application
    platform: iOS
    sources:
      - path: Shelfie
        excludes:
          - "Resources/Products.storekit"
      - path: Shelfie/Resources/Products.storekit
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cmtania.shelfie
        PRODUCT_NAME: Shelfie
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Shelfie
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - ShelfieTests
      storeKitConfiguration: Shelfie/Resources/Products.storekit
  ShelfieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ShelfieTests
    dependencies:
      - target: Shelfie
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.cmtania.shelfie.tests
