# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
# (brew install xcodegen). Shelfie.xcodeproj is generated and git-ignored.
name: Shelfie
options:
  bundleIdPrefix: com.cmtania
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your team here or in Xcode > Signing & Capabilities.
    DEVELOPMENT_TEAM: "MD42BG8ZP4"
targets:
  Shelfie:
    type: application
    platform: iOS
    sources:
      - path: Shelfie
        excludes:
          - "Resources/Products.storekit"
      - path: Shelfie/Resources/Products.storekit
        buildPhase: none
    # XcodeGen writes these keys into Shelfie/Info.plist (generated, git-ignored); Xcode merges
    # them with the INFOPLIST_KEY_ settings below.
    info:
      path: Shelfie/Info.plist
      properties:
        # Launch screen: the logo centred on the warm cream background (dark brown in Dark Mode).
        UILaunchScreen:
          UIImageName: LaunchLogo
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cmtania.shelfie
        PRODUCT_NAME: Shelfie
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Shelfie
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # iPad: every orientation, so the app works in Split View, Stage Manager and resizable windows.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Needed for "Save Image" in the share sheet when sharing the shelf picture.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Shelfie saves the picture of your bookshelf to your photo library when you choose Save Image."
        # iPhone and iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - ShelfieTests
      storeKitConfiguration: Shelfie/Resources/Products.storekit
  ShelfieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ShelfieTests
    dependencies:
      - target: Shelfie
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.cmtania.shelfie.tests
